<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14233f" />
  <meta name="description" content="Tutor Teo, assistente teológico da Escola de Pregadores." />
  
  <!-- Configurações para o app ser instalável -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tutor Teo" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  
  <!-- Biblioteca para renderizar Formatação (Negrito, Listas, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  
  <title>Escola de Pregadores | Tutor Teo</title>
  <style>
    :root{--navy:#14233f;--navy-2:#1e3c72;--gold:#c9a227;--gold-2:#e3c457;--gold-soft:#f7f0d6;--ink:#1f2a3d;--muted:#6b778c;--line:#e2e7ef;--pad:clamp(14px,2.4vw,36px)}
    *{box-sizing:border-box;margin:0;padding:0}
    [hidden]{display:none!important}
    html,body{height:100%}
    body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:#0f2145 url(/assets/fundo.svg) center/cover no-repeat;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
    body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(38% 34% at 22% 22%,rgba(227,196,87,.17),transparent 70%),radial-gradient(34% 30% at 82% 72%,rgba(120,160,240,.2),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
    @keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.1)}}
    @keyframes rise{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

    .topbar,.chat-container{position:relative;z-index:1}
    .topbar{flex:0 0 auto;background:rgba(10,22,46,.55);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;box-shadow:0 1px 0 rgba(227,196,87,.55),0 8px 30px rgba(0,0,0,.25)}
    .topbar-inner{width:100%;display:flex;align-items:center;gap:14px}
    .ia-avatar{width:46px;height:46px;flex:0 0 46px;border-radius:14px;box-shadow:0 0 0 2px rgba(227,196,87,.75),0 0 20px rgba(227,196,87,.35)}
    .ia-info h1{font-size:clamp(17px,1.4vw,20px);font-weight:700;letter-spacing:.3px;line-height:1.2}
    .ia-info h1::after{content:"";display:inline-block;width:8px;height:8px;margin-left:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 9px #4ade80;vertical-align:middle}
    .ia-info p{font-size:12.5px;color:var(--gold-2);margin-top:2px;letter-spacing:.3px}
    .chat-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
    .chat-tools button{min-width:38px;min-height:38px;border:1px solid rgba(255,255,255,.22);border-radius:11px;background:rgba(255,255,255,.08);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .chat-tools button:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
    .chat-tools .font-label{font-size:12px;color:#c9d3e6;min-width:34px;text-align:center}
    button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

    .chat-container{flex:1 1 auto;min-height:0;width:min(1560px,calc(100% - clamp(0px,4vw,56px)));margin:clamp(0px,1.6vw,22px) auto;display:flex;flex-direction:column;background:rgba(8,18,40,.34);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);border:1px solid rgba(255,255,255,.16);border-radius:clamp(0px,1.5vw,24px);box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}

    .daily-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;width:calc(100% - 2*var(--pad));margin:14px var(--pad) 0;padding:12px 16px;border:1px solid rgba(227,196,87,.7);border-radius:14px;background:linear-gradient(135deg,rgba(247,240,214,.97),rgba(240,226,160,.95));color:var(--navy);font-family:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:transform .2s,box-shadow .2s}
    .daily-bar:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(201,162,39,.35)}
    .daily-bar .daily-ico{font-size:22px;line-height:1}
    .daily-bar b{display:block;font-size:15px}
    .daily-bar small{display:block;font-size:12.5px;color:#5b5326;margin-top:1px}
    .daily-bar .daily-go{margin-left:auto;font-size:20px;font-weight:700}

    .daily-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:rgba(6,14,32,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
    .daily-modal{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;background:#fff;border-radius:20px;border-top:4px solid var(--gold);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
    .daily-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
    .daily-head h2{font-size:17px;color:var(--navy)}
    .daily-head small{display:block;font-size:12px;color:var(--muted);font-weight:400;text-transform:capitalize}
    .daily-head .daily-tools{margin-left:auto;display:flex;gap:4px;align-items:center}
    .daily-close{background:none;border:0;cursor:pointer;font-size:26px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:8px}
    .daily-close:hover{background:rgba(20,35,63,.08)}
    .daily-body{padding:16px 20px 20px;overflow-y:auto;font-size:var(--message-font-size,16px);line-height:1.65;color:var(--ink)}
    .daily-body .loading,.daily-body .err{color:var(--muted);text-align:center;padding:28px 0}
    .daily-body .err button{margin-top:12px;border:0;border-radius:9px;padding:9px 16px;background:var(--navy);color:#fff;font-family:inherit;font-weight:600;cursor:pointer}

    .name-bar label{color:var(--navy);font-weight:600}
    .name-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px var(--pad) 0;padding:11px 14px;background:var(--gold-soft);border:1px solid #e6d88f;border-radius:14px;font-size:14px}
    .name-bar input{flex:1 1 140px;min-width:0;padding:9px 12px;border:1px solid #d9cc8a;border-radius:9px;font-size:16px;font-family:inherit;background:#fff}
    .name-bar button{border:0;border-radius:9px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
    .name-bar .ok{background:var(--navy);color:#fff}
    .name-bar .skip{background:transparent;color:var(--muted)}

    .chat-messages{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:var(--pad);display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
    .chat-messages::-webkit-scrollbar{width:8px}
    .chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:10px}

    .message{position:relative;max-width:min(80%,1000px);padding:14px 18px;font-size:var(--message-font-size,16px);line-height:1.65;overflow-wrap:anywhere;display:flex;flex-direction:column;animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
    .message.user{align-self:flex-end;max-width:min(74%,840px);background:linear-gradient(135deg,#3568c0,#1e3c72);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 8px 22px rgba(0,0,0,.3);white-space:pre-wrap}
    .message.ia{align-self:flex-start;margin-left:48px;background:rgba(255,255,255,.97);border:1px solid rgba(20,35,63,.07);border-radius:4px 18px 18px 18px;box-shadow:inset 3px 0 0 var(--gold),0 6px 22px rgba(20,35,63,.09)}
    .message.ia::before{content:"";position:absolute;left:-48px;top:0;width:36px;height:36px;border-radius:11px;background:url(/icons/avatar.svg) center/cover;box-shadow:0 0 0 2px rgba(201,162,39,.6),0 3px 10px rgba(20,35,63,.2)}
    .message.user .message-footer{border-top:0;margin-top:2px;padding-top:0}
    .message.user .message-time{color:#b9c6e0}

    .message-content p{margin-bottom:12px}
    .message-content p:last-child{margin-bottom:0}
    .message-content strong{font-weight:700;color:var(--navy-2)}
    .message-content ul,.message-content ol{margin:0 0 14px 22px}
    .message-content li{margin-bottom:8px;padding-left:2px}
    .message-content li:last-child{margin-bottom:0}
    .message-content li p{margin-bottom:6px}
    .message-content h1,.message-content h2,.message-content h3{font-size:1.06em;color:var(--navy);margin:22px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--gold-soft);box-shadow:0 1px 0 rgba(201,162,39,.25)}
    .message-content > :first-child{margin-top:0}
    .message-content blockquote{border-left:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;margin:12px 0;border-radius:0 10px 10px 0}
    .message-content blockquote p{margin-bottom:6px}
    .message-content blockquote p:last-child{margin-bottom:0}
    .message-content hr{border:0;border-top:1px solid var(--line);margin:16px 0}
    .message-content .bible-ref{color:var(--navy-2);background:var(--gold-soft);border-radius:4px;padding:0 3px;font-size:.84em;font-weight:600;line-height:1.3;white-space:nowrap}
    @media (max-width:700px){.message-content .bible-ref{font-size:.78em;padding:0 2px;border-radius:3px}}

    .message-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:7px;border-top:1px solid var(--line)}
    .message-time{font-size:11px;color:var(--muted);margin-left:auto}
    .message-actions{display:flex;gap:6px;align-items:center}
    .btn-action{background:none;border:0;cursor:pointer;color:var(--navy-2);padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:.65;transition:all .2s}
    .btn-action:hover{background:rgba(30,60,114,.1);opacity:1;transform:scale(1.08)}
    .btn-action.playing{color:var(--gold);opacity:1;animation:pulse 1s infinite}
    .btn-action svg{width:18px;height:18px;fill:currentColor}
    .btn-report{background:none;border:0;cursor:pointer;color:#b4483b;font-size:12px;font-weight:600;padding:4px 8px;border-radius:12px;opacity:.85;font-family:inherit}
    .btn-report:hover{background:rgba(180,72,59,.1);opacity:1}

    .typing-indicator{display:none;align-items:center;gap:10px;padding:0 var(--pad) 10px calc(var(--pad) + 48px);color:#c9d3e6;font-size:13.5px}
    .dots i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--gold);animation:bounce 1.2s infinite}
    .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

    .suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;padding:0 var(--pad) 16px}
    .chat-container:has(.suggestions:not([hidden])) .chat-messages{flex:0 0 auto}
    .suggestions:not([hidden]){flex:1 1 auto;min-height:0;overflow-y:auto;align-content:center}
    .chip{display:flex;flex-direction:column;gap:5px;text-align:left;padding:18px 20px;border-radius:18px;background:#fbfcfe;border:1px solid rgba(20,35,63,.08);border-top:3px solid var(--gold);box-shadow:0 6px 20px rgba(20,35,63,.08);cursor:pointer;font-family:inherit;transition:transform .25s,box-shadow .25s,background .25s}
    .chip b{color:var(--navy);font-size:15.5px}
    .chip small{color:var(--muted);font-size:13px;line-height:1.45}
    .chip:hover{transform:translateY(-4px);background:#fff;box-shadow:0 14px 34px rgba(201,162,39,.25)}

    .chat-input-area{display:flex;align-items:flex-end;gap:10px;padding:12px var(--pad) 6px;flex:0 0 auto;background:linear-gradient(to top,rgba(8,18,40,.55),rgba(8,18,40,0))}
    .btn-mic{background:#fff;border:1px solid var(--line);width:50px;height:50px;flex:0 0 50px;border-radius:50%;cursor:pointer;color:var(--navy-2);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,35,63,.1);transition:all .2s}
    .btn-mic:hover{border-color:var(--gold);transform:translateY(-1px)}
    .btn-mic.listening{color:#fff;background:#b4483b;border-color:#b4483b;animation:pulse 1s infinite}
    .btn-mic svg{width:22px;height:22px;fill:currentColor}
    .chat-input-area textarea{min-width:0;flex:1;padding:14px 20px;border:1px solid var(--line);border-radius:26px;font-size:16px;outline:0;background:#fff;resize:none;overflow-y:hidden;min-height:50px;max-height:160px;font-family:inherit;line-height:1.4;color:var(--ink);box-shadow:0 4px 18px rgba(20,35,63,.1);transition:border-color .2s,box-shadow .2s}
    .chat-input-area textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.2),0 4px 18px rgba(20,35,63,.1)}
    .chat-input-area button.send-btn{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold-2),#b8941f);color:var(--navy);border:0;border-radius:26px;height:50px;padding:0 24px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;flex:0 0 auto;box-shadow:0 8px 22px rgba(201,162,39,.4);transition:transform .2s,box-shadow .2s,filter .2s}
    .send-btn svg{width:18px;height:18px;fill:currentColor}
    .chat-input-area button.send-btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 12px 28px rgba(201,162,39,.5)}
    .chat-input-area button:disabled,.chat-input-area textarea:disabled{opacity:.55;cursor:not-allowed}
    .footnote{font-size:11.5px;color:rgba(255,255,255,.62);text-align:center;padding:0 var(--pad) calc(10px + env(safe-area-inset-bottom));line-height:1.4}

    @media (max-width:700px){
      .chat-container{width:100%;margin:0;border-radius:0;border-width:1px 0 0}
      .ia-info p,.chat-tools .font-label,.send-btn .lbl{display:none}
      .chat-input-area button.send-btn{padding:0 17px}
      .message{max-width:100%}
      .message.user{max-width:88%}
      .message.ia{margin-left:40px;max-width:calc(100% - 40px)}
      .message.ia::before{left:-40px;width:30px;height:30px;border-radius:9px}
      .typing-indicator{padding-left:calc(var(--pad) + 40px)}
      .suggestions{grid-template-columns:1fr 1fr;gap:10px}
      .chip{padding:14px}
    }
    @media (max-width:400px){.suggestions{grid-template-columns:1fr}}
    @media (min-width:1500px){.message{font-size:calc(var(--message-font-size,16px) + 1px)}}
    @media (max-height:520px) and (orientation:landscape){
      .topbar{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}
      .ia-avatar{width:34px;height:34px;flex-basis:34px}
      .ia-info p,.footnote{display:none}
      .chat-container{margin:0 auto;border-radius:0}
    }
    @media (prefers-reduced-motion:reduce){*,body::before{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img class="ia-avatar" src="/icons/avatar.svg" alt="Tutor Teo" width="44" height="44" />
      <div class="ia-info">
        <h1>Tutor Teo</h1>
        <p>Escola de Pregadores · Assistente teológico</p>
      </div>
      <div class="chat-tools">
        <button type="button" id="clear-chat" title="Limpar conversa" aria-label="Limpar conversa">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
        <button type="button" id="font-down" title="Diminuir letras" aria-label="Diminuir letras">A−</button>
        <span class="font-label" id="font-size-label">16px</span>
        <button type="button" id="font-up" title="Aumentar letras" aria-label="Aumentar letras">A+</button>
      </div>
    </div>
  </header>

  <main class="chat-container" aria-label="Conversa com o Tutor Teo">
    <button type="button" class="daily-bar" id="daily-open" aria-haspopup="dialog">
      <span class="daily-ico" aria-hidden="true">📖</span>
      <span><b>Mensagem do dia</b><small>Devocional com aplicação prática para hoje</small></span>
      <span class="daily-go" aria-hidden="true">›</span>
    </button>

    <form class="name-bar" id="name-form" hidden>
      <label for="name-input">Como posso te chamar?</label>
      <input id="name-input" maxlength="30" autocomplete="given-name" placeholder="Seu nome" />
      <button type="submit" class="ok">Salvar</button>
      <button type="button" class="skip" id="name-skip">Agora não</button>
    </form>

    <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
    <div class="typing-indicator" id="typing-indicator"><span class="dots"><i></i><i></i><i></i></span>Tutor Teo está preparando a resposta…</div>

    <div class="suggestions" id="suggestions" hidden>
      <button type="button" class="chip" data-q="Como preparar um esboço de sermão?"><b>Esboço de sermão</b><small>Como preparar um esboço de sermão?</small></button>
      <button type="button" class="chip" data-q="Qual a diferença entre exegese e eisegese?"><b>Exegese x eisegese</b><small>Entenda a diferença e por que importa</small></button>
      <button type="button" class="chip" data-q="Explique Romanos 8:1 com o contexto histórico."><b>Romanos 8:1</b><small>Explicação com o contexto histórico</small></button>
      <button type="button" class="chip" data-q="Como aplicar um texto bíblico à vida da igreja?"><b>Aplicação do texto</b><small>Como levar a Palavra à vida da igreja</small></button>
    </div>

    <form class="chat-input-area" id="chat-form">
      <button type="button" id="mic-button" class="btn-mic" title="Falar" aria-label="Falar sua pergunta">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
      <textarea id="user-input" rows="1" maxlength="5000" placeholder="Digite sua pergunta..." aria-label="Sua pergunta" required></textarea>
      <button type="submit" id="send-button" class="send-btn"><span class="lbl">Enviar</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
    </form>
    <p class="footnote">Respostas geradas por inteligência artificial; confira pontos importantes com seu professor. Suas conversas ficam salvas só neste aparelho.</p>
  </main>

  <div class="daily-overlay" id="daily-overlay" hidden>
    <div class="daily-modal message-content" role="dialog" aria-modal="true" aria-labelledby="daily-title">
      <div class="daily-head">
        <span aria-hidden="true" style="font-size:22px">📖</span>
        <h2 id="daily-title">Mensagem do dia<small id="daily-date"></small></h2>
        <div class="daily-tools">
          <button type="button" class="btn-action btn-audio" id="daily-audio" title="Ouvir mensagem" aria-label="Ouvir mensagem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
          <button type="button" class="btn-action" id="daily-copy" title="Copiar" aria-label="Copiar mensagem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
          <button type="button" class="daily-close" id="daily-close" aria-label="Fechar">×</button>
        </div>
      </div>
      <div class="daily-body" id="daily-body"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); }); }

    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const messagesContainer = document.getElementById("chat-messages");
    const typingIndicator = document.getElementById("typing-indicator");
    const sendButton = document.getElementById("send-button");
    const micBtn = document.getElementById("mic-button");
    const clearBtn = document.getElementById("clear-chat");
    
    const STORAGE_KEY = "tutorTeoChatHistory_v1";
    const FONT_KEY = "tutorTeoFontSize_v1";
    const WELCOME = "Olá! Sou o Tutor Teo, assistente virtual da Escola de Pregadores. O que gostaria de perguntar hoje?";
    
    let fontSize = 16;
    let conversation = [];

    const NAME_KEY = "tutorTeoStudentName_v1";
    const nameForm = document.getElementById("name-form");
    const nameInput = document.getElementById("name-input");
    const suggestionsBox = document.getElementById("suggestions");
    const isTouch = window.matchMedia("(pointer: coarse)").matches;
    let nameSkipped = false;
    function cleanName(v) { return String(v || "").replace(/[^\p{L}\p{M}' -]/gu, "").trim().slice(0, 30); }
    let studentName = "";
    try { studentName = cleanName(localStorage.getItem(NAME_KEY)); } catch (_) {}
    function welcomeText() {
      return studentName ? `Paz, ${studentName}! Sou o Tutor Teo, assistente virtual da Escola de Pregadores. Sobre o que vamos estudar hoje?` : WELCOME;
    }
    function refreshStartUI() {
      const empty = conversation.length === 0;
      suggestionsBox.hidden = !empty;
      nameForm.hidden = !(empty && !studentName && !nameSkipped);
    }
    nameForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const n = cleanName(nameInput.value);
      if (!n) return;
      studentName = n;
      try { localStorage.setItem(NAME_KEY, n); } catch (_) {}
      if (!conversation.length) { messagesContainer.innerHTML = ""; appendMessage(welcomeText(), "ia", "Agora", false); }
      refreshStartUI();
    });
    document.getElementById("name-skip").addEventListener("click", () => { nameSkipped = true; refreshStartUI(); });
    suggestionsBox.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-q]");
      if (!btn) return;
      input.value = btn.dataset.q;
      form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
    });

    input.addEventListener("input", function() {
      this.style.height = 'auto';
      const cs = getComputedStyle(this);
      const max = parseFloat(cs.maxHeight) || 160;
      const h = this.scrollHeight + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
      this.style.height = Math.min(h, max) + 'px';
      this.style.overflowY = h > max ? 'auto' : 'hidden';
    });
    
    input.addEventListener("keydown", function(e) {
      if (e.key === 'Enter' && !e.shiftKey && !isTouch) {
        e.preventDefault();
        if(input.value.trim() !== '') form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      
      micBtn.addEventListener('click', () => {
        if(micBtn.classList.contains('listening')) recognition.stop();
        else recognition.start();
      });
      
      recognition.onstart = () => { micBtn.classList.add('listening'); input.placeholder = "Ouvindo..."; };
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        input.value += (input.value ? ' ' : '') + transcript;
        input.dispatchEvent(new Event('input'));
      };
      recognition.onend = () => { micBtn.classList.remove('listening'); input.placeholder = "Digite sua pergunta..."; };
      recognition.onerror = () => { micBtn.classList.remove('listening'); input.placeholder = "Digite sua pergunta..."; };
    } else {
      micBtn.style.display = 'none';
    }

    clearBtn.addEventListener('click', () => {
      if(confirm('Tem certeza que deseja apagar todo o histórico da conversa?')) {
        conversation = [];
        saveHistory();
        messagesContainer.innerHTML = '';
        appendMessage(welcomeText(), "ia", "Agora", false);
        nameSkipped = false;
        refreshStartUI();
      }
    });

    function speakText(text, btnElement) {
      if (!('speechSynthesis' in window)) return alert("Navegador não suporta áudio.");
      if (btnElement.classList.contains('playing')) {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.btn-audio').forEach(b => b.classList.remove('playing'));
        return;
      }
      window.speechSynthesis.cancel();
      document.querySelectorAll('.btn-audio').forEach(b => b.classList.remove('playing'));

      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = renderMarkdown(text);
      const cleanText = tempDiv.textContent || tempDiv.innerText || "";

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'pt-BR';
      
      utterance.onstart = () => btnElement.classList.add('playing');
      utterance.onend = () => btnElement.classList.remove('playing');
      utterance.onerror = () => btnElement.classList.remove('playing');
      
      window.speechSynthesis.speak(utterance);
    }

    function renderMarkdown(text) { return DOMPurify.sanitize(marked.parse(text)); }
    function getCurrentTime() { return new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" }).format(new Date()); }
    function saveHistory() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversation)); } catch (e) {} }

    function reportarErroWhatsApp(textoIA) {
      const numero = "5521997882718";
      
      // Constrói o log completo do erro
      let logCompleto = "⚠️ *Reporte de Erro - Tutor Teo*\n\n";
      
      if (conversation && conversation.length > 0) {
        const ultimaMensagemUsuario = conversation.slice().reverse().find(m => m.role === "user");
        if (ultimaMensagemUsuario && ultimaMensagemUsuario.content) {
          logCompleto += "*MINHA PERGUNTA:*\n" + ultimaMensagemUsuario.content + "\n\n";
        }
      }
      
      if (textoIA) {
         logCompleto += "*RESPOSTA DA IA:*\n" + textoIA;
      }

      // Tenta copiar todo o conteúdo para a área de transferência do usuário automaticamente
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(logCompleto).then(() => {
          // Se conseguir copiar, abre o WhatsApp com um link curto pedindo apenas para colar
          let textoCurto = "Olá, encontrei um erro no Tutor Teo. A conversa completa já foi copiada no meu celular/computador, estou colando abaixo:\n\n[ COLE AQUI O TEXTO COPIADO ]";
          const url = `https://wa.me/${numero}?text=${encodeURIComponent(textoCurto)}`;
          window.open(url, '_blank');
        }).catch(err => {
          fallbackWhatsApp(textoIA, numero);
        });
      } else {
        fallbackWhatsApp(textoIA, numero);
      }
    }

    // Função de fallback caso o navegador bloqueie o copy-paste automático
    function fallbackWhatsApp(textoIA, numero) {
      let trechoIA = textoIA ? textoIA.substring(0, 1000) + "...\n[Mensagem cortada pelo limite do WhatsApp]" : "";
      let mensagem = "Olá, encontrei um erro no Tutor Teo.\n\nResposta gerada:\n" + trechoIA;
      const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }

    function appendMessage(text, sender, timeText = getCurrentTime(), shouldScroll = true) {
      const messageDiv = document.createElement("div");
      messageDiv.className = `message ${sender}`;
      
      const contentDiv = document.createElement("div");
      contentDiv.className = "message-content";
      
      if (sender === "ia") contentDiv.innerHTML = renderMarkdown(text);
      else contentDiv.textContent = text;
      
      messageDiv.appendChild(contentDiv);

      const footerDiv = document.createElement("div");
      footerDiv.className = "message-footer";

      if (sender === "ia") {
        const actionsDiv = document.createElement("div");
        actionsDiv.className = "message-actions";

        const audioBtn = document.createElement("button");
        audioBtn.className = "btn-action btn-audio";
        audioBtn.title = "Ouvir resposta"; audioBtn.setAttribute("aria-label", "Ouvir resposta");
        audioBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
        audioBtn.onclick = () => speakText(text, audioBtn);
        
        const copyBtn = document.createElement("button");
        copyBtn.className = "btn-action";
        copyBtn.title = "Copiar texto"; copyBtn.setAttribute("aria-label", "Copiar texto");
        copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
        copyBtn.onclick = () => {
          const tempDiv = document.createElement("div");
          tempDiv.innerHTML = renderMarkdown(text);
          navigator.clipboard.writeText(tempDiv.textContent || tempDiv.innerText || "");
          
          copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>`;
          setTimeout(() => { copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`; }, 2000);
        };

        const reportBtn = document.createElement("button");
        reportBtn.className = "btn-report";
        reportBtn.title = "Reportar erro via WhatsApp";
        reportBtn.textContent = "Reportar erro";
        reportBtn.onclick = () => reportarErroWhatsApp(text);

        actionsDiv.appendChild(audioBtn);
        actionsDiv.appendChild(copyBtn);
        actionsDiv.appendChild(reportBtn);
        
        footerDiv.appendChild(actionsDiv);
      }

      const time = document.createElement("span");
      time.className = "message-time";
      time.textContent = timeText;
      footerDiv.appendChild(time);
      
      messageDiv.appendChild(footerDiv);
      messagesContainer.appendChild(messageDiv);
      if (shouldScroll) scrollToLatest();
    }

    function scrollToLatest() { requestAnimationFrame(() => { messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' }); }); }

    function loadHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (Array.isArray(saved)) conversation = saved.filter(item => item && ["user", "assistant"].includes(item.role) && typeof item.content === "string");
      } catch (error) { conversation = []; }

      if (conversation.length) conversation.forEach(item => appendMessage(item.content, item.role === "user" ? "user" : "ia", item.time || "Salvo", false));
      else appendMessage(welcomeText(), "ia", "Agora", false);
      refreshStartUI(); setTimeout(scrollToLatest, 100);
    }

    function applyFontSize() {
      document.documentElement.style.setProperty("--message-font-size", `${fontSize}px`);
      document.getElementById("font-size-label").textContent = `${fontSize}px`;
      try { localStorage.setItem(FONT_KEY, String(fontSize)); } catch (_) {}
    }

    document.getElementById("font-down").addEventListener("click", () => { fontSize = Math.max(14, fontSize - 1); applyFontSize(); });
    // Limite máximo de fonte aumentado para 40px
    document.getElementById("font-up").addEventListener("click", () => { fontSize = Math.min(40, fontSize + 1); applyFontSize(); });
    try { fontSize = Math.min(40, Math.max(14, Number(localStorage.getItem(FONT_KEY)) || 16)); } catch (_) {}
    applyFontSize();
    loadHistory();

    /* ---------------- Mensagem do dia ---------------- */
    const DAILY_KEY = "tutorTeoDailyMsg_v1";
    const dailyOverlay = document.getElementById("daily-overlay");
    const dailyBody = document.getElementById("daily-body");
    const dailyAudio = document.getElementById("daily-audio");
    const dailyCopy = document.getElementById("daily-copy");
    let dailyText = "";
    let dailyLoading = false;

    function todayKey() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function readDailyCache() {
      try {
        const c = JSON.parse(localStorage.getItem(DAILY_KEY) || "null");
        if (c && c.date === todayKey() && typeof c.text === "string" && c.text.trim()) return c.text;
      } catch (_) {}
      return "";
    }
    function showDaily(text) {
      dailyText = text;
      dailyBody.innerHTML = renderMarkdown(text);
      dailyBody.scrollTop = 0;
    }
    async function loadDaily() {
      const cached = readDailyCache();
      if (cached) return showDaily(cached);
      if (dailyLoading) return;
      dailyLoading = true;
      dailyText = "";
      dailyBody.innerHTML = '<div class="loading"><span class="dots"><i></i><i></i><i></i></span><p style="margin-top:8px">Preparando a mensagem de hoje…</p></div>';
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ devotional: true, date: todayKey() })
        });
        let data;
        try { data = await response.json(); } catch { throw new Error("O servidor retornou uma resposta inválida."); }
        if (!response.ok) throw new Error(data.error || "Não foi possível carregar a mensagem do dia.");
        if (typeof data.resposta !== "string" || !data.resposta.trim()) throw new Error("A mensagem veio vazia. Tente novamente.");
        try { localStorage.setItem(DAILY_KEY, JSON.stringify({ date: todayKey(), text: data.resposta })); } catch (_) {}
        showDaily(data.resposta);
      } catch (error) {
        dailyBody.innerHTML = '<div class="err"></div>';
        const box = dailyBody.firstChild;
        box.textContent = error.message || "Erro de conexão. Verifique sua internet.";
        const retry = document.createElement("button");
        retry.type = "button"; retry.textContent = "Tentar de novo";
        retry.onclick = loadDaily;
        box.appendChild(document.createElement("br")); box.appendChild(retry);
      } finally {
        dailyLoading = false;
      }
    }
    function openDaily() {
      document.getElementById("daily-date").textContent = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
      dailyOverlay.hidden = false;
      loadDaily();
    }
    function closeDaily() {
      dailyOverlay.hidden = true;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      dailyAudio.classList.remove("playing");
      document.getElementById("daily-open").focus();
    }
    document.getElementById("daily-open").addEventListener("click", openDaily);
    document.getElementById("daily-close").addEventListener("click", closeDaily);
    dailyOverlay.addEventListener("click", (e) => { if (e.target === dailyOverlay) closeDaily(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !dailyOverlay.hidden) closeDaily(); });
    dailyAudio.addEventListener("click", () => { if (dailyText) speakText(dailyText, dailyAudio); });
    dailyCopy.addEventListener("click", () => {
      if (!dailyText) return;
      const tmp = document.createElement("div");
      tmp.innerHTML = renderMarkdown(dailyText);
      try { navigator.clipboard.writeText(tmp.textContent || ""); } catch (_) {}
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      document.querySelectorAll('.btn-audio').forEach(b => b.classList.remove('playing'));

      const messageText = input.value.trim();
      if (!messageText || sendButton.disabled) return;

      appendMessage(messageText, "user");
      conversation.push({ role: "user", content: messageText, time: getCurrentTime() });
      refreshStartUI();
      saveHistory();
      
      input.value = "";
      input.style.height = 'auto';
      input.style.overflowY = 'hidden';
      sendButton.disabled = true;
      input.disabled = true;
      micBtn.disabled = true;
      typingIndicator.style.display = "block";
      scrollToLatest();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ studentName, messages: conversation.slice(-12).map(({ role, content }) => ({ role, content })) })
        });

        let data;
        try { data = await response.json(); } catch { throw new Error("O servidor retornou uma resposta inválida."); }

        if (!response.ok) throw new Error(data.error || "Não foi possível obter uma resposta.");
        if (typeof data.resposta !== "string" || !data.resposta.trim()) throw new Error("O Tutor Teo retornou uma resposta vazia. Tente novamente.");

        conversation.push({ role: "assistant", content: data.resposta, time: getCurrentTime() });
        saveHistory();
        appendMessage(data.resposta, "ia");
      } catch (error) {
        console.error("Erro ao enviar:", error);
        appendMessage(error.message || "Erro de conexão. Verifique sua internet e tente novamente.", "ia");
        if (conversation.length && conversation[conversation.length - 1].role === "user") conversation.pop();
        saveHistory();
      } finally {
        typingIndicator.style.display = "none";
        sendButton.disabled = false;
        input.disabled = false;
        micBtn.disabled = false;
        input.focus();
        scrollToLatest();
      }
    });
  </script>
</body>
</html>
