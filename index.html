<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escola de Pregadores</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2c3e50" />
    <style>
      :root {
        --primary-color: #2c3e50;
        --secondary-color: #d4af37;
        --bg-color: #f8f9fa;
        --text-color: #333;
        --message-user-bg: #e3f2fd;
        --message-ia-bg: #f1f8e9;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      header {
        width: 100%;
        background-color: var(--primary-color);
        color: white;
        padding: 20px 0;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      header h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      header p {
        font-size: 14px;
        color: var(--secondary-color);
        margin-top: 5px;
      }

      .chat-container {
        width: 100%;
        max-width: 800px;
        background: #fff;
        margin: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        height: calc(100vh - 140px);
        overflow: hidden;
      }

      .chat-header {
        background-color: #f1f3f5;
        padding: 15px 20px;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .ia-avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background-color: var(--secondary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 18px;
      }

      .ia-info h3 {
        font-size: 16px;
        color: var(--primary-color);
      }

      .ia-info p {
        font-size: 12px;
        color: #6c757d;
      }

      .chat-messages {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14.5px;
        line-height: 1.5;
        position: relative;
      }

      .message.user {
        align-self: flex-end;
        background-color: var(--message-user-bg);
        border-bottom-right-radius: 0;
        color: #0d47a1;
      }

      .message.ia {
        align-self: flex-start;
        background-color: var(--message-ia-bg);
        border-bottom-left-radius: 0;
        color: #2e7d32;
      }

      .message-time {
        font-size: 10px;
        color: #999;
        margin-top: 5px;
        text-align: right;
        display: block;
      }

      .chat-input-area {
        padding: 15px 20px;
        background-color: #fff;
        border-top: 1px solid #e9ecef;
        display: flex;
        gap: 10px;
      }

      .chat-input-area input {
        flex-grow: 1;
        padding: 12px 15px;
        border: 1px solid #ced4da;
        border-radius: 25px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.3s;
      }

      .chat-input-area input:focus {
        border-color: var(--secondary-color);
      }

      .chat-input-area button {
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 25px;
        padding: 0 25px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chat-input-area button:hover {
        background-color: #1a252f;
      }

      .typing-indicator {
        display: none;
        align-self: flex-start;
        background-color: var(--message-ia-bg);
        padding: 12px 16px;
        border-radius: 8px;
        border-bottom-left-radius: 0;
        color: #2e7d32;
        font-size: 14px;
        font-style: italic;
      }

      @media (max-width: 600px) {
        .chat-container {
          margin: 0;
          height: calc(100vh - 85px);
          border-radius: 0;
        }
        header {
          padding: 15px 0;
        }
        header h1 {
          font-size: 20px;
        }
        .message {
          max-width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Escola de Pregadores</h1>
      <p>Formando com Excelência e Fé</p>
    </header>

    <div class="chat-container">
      <div class="chat-header">
        <div class="ia-avatar">T</div>
        <div class="ia-info">
          <h3>Tutor Teo</h3>
          <p>Seu Assistente Teológico</p>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="message ia">
          Olá! Sou o Tutor Teo, o assistente virtual da Escola de Pregadores. O
          que gostaria de perguntar hoje?
          <span class="message-time">Agora</span>
        </div>
      </div>

      <div class="typing-indicator" id="typing-indicator">
        Tutor Teo está a formular a resposta...
      </div>

      <div class="chat-input-area">
        <input
          type="text"
          id="user-input"
          placeholder="Digite sua pergunta..."
          onkeypress="handleKeyPress(event)"
        />
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

    <script>
      function getCurrentTime() {
        const now = new Date();
        return (
          now.getHours().toString().padStart(2, "0") +
          ":" +
          now.getMinutes().toString().padStart(2, "0")
        );
      }

      function appendMessage(text, sender) {
        const messagesContainer = document.getElementById("chat-messages");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}`;

        const formattedText = text.replace(/\n/g, "<br>");

        messageDiv.innerHTML = `
                ${formattedText}
                <span class="message-time">${getCurrentTime()}</span>
            `;

        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const messageText = inputField.value.trim();
        const typingIndicator = document.getElementById("typing-indicator");

        if (messageText === "") return;

        appendMessage(messageText, "user");
        inputField.value = "";

        typingIndicator.style.display = "block";
        const messagesContainer = document.getElementById("chat-messages");
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ prompt: messageText }),
          });

          const data = await response.json();
          typingIndicator.style.display = "none";

          if (data.resposta) {
            appendMessage(data.resposta, "ia");
          } else if (data.error) {
            appendMessage(`Erro: ${data.error}`, "ia");
          } else {
            appendMessage(
              "Desculpe, ocorreu um erro técnico na comunicação com o servidor.",
              "ia",
            );
          }
        } catch (error) {
          console.error(error);
          typingIndicator.style.display = "none";
          appendMessage("Erro de ligação. Verifique a sua internet.", "ia");
        }
      }

      function handleKeyPress(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      }
    </script>
  </body>
</html>
